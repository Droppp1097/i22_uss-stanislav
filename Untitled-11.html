<!DOCTYPE html>
<!-- Виправлення 1: Додано атрибут lang="uk" для визначення мови документа -->
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Курс HTML для початківців</title>
</head>
<body>

    <!-- Виправлення 2: Головний заголовок сторінки змінено на h1 замість h2 -->
    <!-- Виправлення 3: Основний вміст обгорнуто в семантичний тег <main> -->
    <main>
        <h1>Курс HTML для початківців</h1>

        <!-- Виправлення 4: Використано тег <nav> та зрозумілий текст посилань замість «Тут» і «Натиснути тут» -->
        <nav aria-label="Основна навігація">
            <a href="index.html">Головна</a>
            <a href="lessons.html">Уроки</a>
            <a href="contacts.html">Контакти</a>
        </nav>

        <!-- Виправлення 5: Рівні заголовків змінено з h4 на h2 для дотримання ієрархії (після h1 іде h2) -->
        <h2>Про курс</h2>

        <!-- Виправлення 6: Додано атрибут alt для опису зображення -->
        <img src="students.jpg" alt="Студенти, які навчаються на курсі HTML">

        <p>На курсі ви навчитеся створювати вебсторінки.</p>

        <h2>Реєстрація</h2>

        <form>
            <!-- Виправлення 7: Додано теги <label> з відповідними атрибутами for для полів форми -->
            <div>
                <label for="name">Ім'я:</label>
                <input type="text" id="name" name="name" required>
            </div>

            <!-- Виправлення 8: Змінено тип поля для email з type="text" на type="email" -->
            <div>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <br>
            <!-- Виправлення 9: Задано чіткий тип кнопки type="submit" -->
            <button type="submit">Зареєструватися</button>
        </form>
    </main>

</body>
</html>
