<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Галерея фотографій</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="layout">
        <header class="header">
            <h1>Моя Фотогалерея</h1>
            <nav class="nav">
                <a>Головна</a>
                <a>Природа</a>
                <a>Портрети</a>
                <a>Контакти</a>
            </nav>
        </header>

        <main class="main">
            <div class="gallery">
                <div class="photo item-wide">
                    <img src="photo1.jpg" alt="Пейзаж 1">
                </div>
                <div class="photo">
                    <img src="photo2.jpg" alt="Природа">
                </div>
                <div class="photo item-tall">
                    <img src="photo3.jpg" alt="Вертикальне фото">
                </div>
                <div class="photo">
                    <img src="photo4.jpg" alt="Ліс">
                </div>
                <div class="photo item-wide">
                    <img src="photo5.jpg" alt="Пейзаж 2">
                </div>
                <div class="photo">
                    <img src="photo6.jpg" alt="Парк">
                </div>
                <div class="photo">
                    <img src="photo7.jpg" alt="Туман">
                </div>
                <div class="photo">
                    <img src="photo8.jpg" alt="Гори">
                </div>
                <div class="photo">
                    <img src="photo9.jpg" alt="Водоспад">
                </div>
            </div>
        </main>

        <footer class="footer">
            <p>&copy; 2026 Фотогалерея. Всі права захищені.</p>
        </footer>
    </div>
</body>
</html>
