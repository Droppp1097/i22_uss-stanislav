<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Адаптивний інтернет-магазин</title>
    <style>
        /* Базові стилі */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            background-color: #f4f4f9;
            color: #333;
        }

        /* 1. Шапка сайту з назвою та меню навігації */
        header {
            background-color: #2c3e50;
            color: #fff;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 24px;
        }

        /* 6. Меню навігації (горизонтальне за замовчуванням) */
        nav ul {
            list-style: none;
            display: flex;
            gap: 15px;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            font-weight: bold;
        }

        /* Контейнер для каталогу */
        main {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .catalog-title {
            text-align: center;
            margin-bottom: 20px;
            font-size: 28px;
        }

        /* 3. Розташування карток за допомогою CSS Grid (за замовчуванням 3 колонки для ПК) */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        /* 2. Картки товарів */
        .product-card {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* 4. Адаптивні зображення */
        .product-card img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
        }

        .product-card h3 {
            font-size: 18px;
            margin: 10px 0;
        }

        .price {
            font-size: 16px;
            font-weight: bold;
            color: #e74c3c;
            margin-bottom: 15px;
        }

        .buy-btn {
            background-color: #27ae60;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        .buy-btn:hover {
            background-color: #219150;
        }

        /* Медіа-запити для адаптивності */

        /* 3. На планшеті (до 900px) — 2 колонки */
        @media (max-width: 900px) {
            .products-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* 3, 5, 6. На смартфоні (до 600px) — 1 колонка, вертикальне меню, зменшені відступи та заголовки */
        @media (max-width: 600px) {
            /* 3. 1 колонка для карток */
            .products-grid {
                grid-template-columns: 1fr;
            }

            /* 6. Вертикальне меню навігації */
            header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            nav ul {
                flex-direction: column;
                gap: 10px;
            }

            /* 5. Зміна розміру заголовків та відступів */
            header h1 {
                font-size: 20px;
            }

            .catalog-title {
                font-size: 22px;
                margin-bottom: 15px;
            }

            main {
                margin: 10px auto;
                padding: 0 10px;
            }

            .product-card {
                padding: 10px;
            }
        }
    </style>
</head>
<body>

    <!-- 1. Шапка з назвою та меню -->
    <header>
        <h1>TechStore</h1>
        <nav>
            <ul>
                <li><a href="#">Головна</a></li>
                <li><a href="#">Каталог</a></li>
                <li><a href="#">Про нас</a></li>
                <li><a href="#">Контакти</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2 class="catalog-title">Каталог товарів</h2>

        <!-- 2. Каталог із 6 карток товарів -->
        <div class="products-grid">
            
            <div class="product-card">
                <img src="https://via.placeholder.com/300x200" alt="Смартфон">
                <h3>Смартфон Flagship X</h3>
                <p class="price">25 000 грн</p>
                <button class="buy-btn">Купити</button>
            </div>

            <div class="product-card">
                <img src="https://via.placeholder.com/300x200" alt="Ноутбук">
                <h3>Ноутбук Pro 15</h3>
                <p class="price">42 000 грн</p>
                <button class="buy-btn">Купити</button>
            </div>

            <div class="product-card">
                <img src="https://via.placeholder.com/300x200" alt="Навушники">
                <h3>Бездротові навушники</h3>
                <p class="price">3 500 грн</p>
                <button class="buy-btn">Купити</button>
            </div>

            <div class="product-card">
                <img src="https://via.placeholder.com/300x200" alt="Смарт-годинник">
                <h3>Смарт-годинник Fit</h3>
                <p class="price">6 200 грн</p>
                <button class="buy-btn">Купити</button>
            </div>

            <div class="product-card">
                <img src="https://via.placeholder.com/300x200" alt="Планшет">
                <h3>Планшет Tab Ultra</h3>
                <p class="price">18 000 грн</p>
                <button class="buy-btn">Купити</button>
            </div>

            <div class="product-card">
                <img src="https://via.placeholder.com/300x200" alt="Портативна колонка">
                <h3>Портативна колонка Sound</h3>
                <p class="price">2 800 грн</p>
                <button class="buy-btn">Купити</button>
            </div>

        </div>
    </main>

</body>
</html>
